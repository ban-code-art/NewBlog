spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/yunyu}
    username: ${SPRING_DATASOURCE_USERNAME:yunyu}
    password: ${SPRING_DATASOURCE_PASSWORD:yunyu123456}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  jackson:
    default-property-inclusion: non_null

springdoc:
  api-docs:
    enabled: false
    path: /v3/api-docs
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,threaddump
  endpoint:
    health:
      probes:
        enabled: true

yunyu:
  security:
    jwt:
      secret: ${YUNYU_JWT_SECRET:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      expire-days: ${YUNYU_JWT_EXPIRE_DAYS:7}
